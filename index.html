<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 El Conejo te Habla</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d0d;
    --accent: #c8ff00;
    --pink: #ff2d78;
    --blue: #00cfff;
    --text: #f0f0f0;
    --dim: #444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 36px;
    overflow-x: hidden;
    transition: background 0.6s;
  }

  body.mood-good  { background: #0a1a00; }
  body.mood-bad   { background: #0d0008; }
  body.mood-neutral { background: #000d1a; }

  /* Header */
  .header { text-align: center; }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 80px);
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .header p { font-size: 11px; color: var(--dim); letter-spacing: 3px; margin-top: 8px; text-transform: uppercase; }

  /* Input */
  .input-section {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; width: 100%; max-width: 500px;
  }
  .input-label { font-size: 11px; color: var(--dim); letter-spacing: 3px; text-align: center; }

  textarea {
    width: 100%; background: #111; border: 1px solid #2a2a2a;
    border-radius: 8px; color: var(--text); font-family: 'Space Mono', monospace;
    font-size: 14px; padding: 16px; resize: none; height: 80px; outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #333; }
  textarea:disabled { opacity: 0.4; }

  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .ask-btn {
    background: var(--accent); color: #0d0d0d;
    border: none; border-radius: 6px; font-family: 'Space Mono', monospace;
    font-size: 13px; font-weight: 700; padding: 14px 28px; cursor: pointer;
    letter-spacing: 2px; text-transform: uppercase;
    transition: transform 0.15s, opacity 0.15s;
  }
  .ask-btn:hover { opacity: 0.85; }
  .ask-btn:active { transform: scale(0.97); }
  .ask-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .reset-btn {
    background: transparent; color: var(--dim);
    border: 1px solid #333; border-radius: 6px; font-family: 'Space Mono', monospace;
    font-size: 12px; padding: 14px 24px; cursor: pointer;
    letter-spacing: 2px; text-transform: uppercase;
    transition: all 0.2s; display: none;
  }
  .reset-btn:hover { border-color: var(--text); color: var(--text); }
  .reset-btn.visible { display: block; }

  /* Card */
  .card-scene { perspective: 1000px; width: 340px; height: 230px; }

  .card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 28px;
  }

  .card-front {
    background: linear-gradient(135deg, #1a0a2e, #0d0d1a);
    border: 1px solid #2d1a4a;
  }
  .card-front-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .rabbit-emoji { font-size: 52px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .card-front p { font-size: 11px; color: #554466; letter-spacing: 3px; text-align: center; }

  .card-back {
    transform: rotateY(180deg); text-align: center; gap: 16px;
    transition: background 0.4s, border-color 0.4s;
  }
  .card-back.good    { background: linear-gradient(135deg, #0a1f00, #0d2200); border: 1px solid #1a4400; }
  .card-back.bad     { background: linear-gradient(135deg, #1a0010, #0d0008); border: 1px solid #440022; }
  .card-back.neutral { background: linear-gradient(135deg, #001a2e, #000d1a); border: 1px solid #003366; }

  .card-back .quote {
    font-family: 'Space Mono', monospace;
    font-size: clamp(12px, 2.5vw, 14px);
    line-height: 1.7; font-style: italic;
    transition: color 0.4s;
  }
  .card-back.good    .quote { color: var(--accent); }
  .card-back.bad     .quote { color: var(--pink); }
  .card-back.neutral .quote { color: var(--blue); }

  .card-back .mood-icon { font-size: 28px; margin-bottom: 4px; }

  .card-back .song {
    font-size: 10px; color: #446644; letter-spacing: 2px;
    text-transform: uppercase; margin-top: 6px;
  }
  .card-back.bad    .song { color: #664455; }
  .card-back.neutral .song { color: #224466; }
  .card-back .song span { color: var(--pink); }

  /* Canvas overlay */
  #fx-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 99;
  }

  /* Floating emojis */
  .float-emoji {
    position: fixed; font-size: 28px; pointer-events: none; z-index: 100;
    animation: floatUp 2.5s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-200px) scale(0.5) rotate(30deg); }
  }

  /* Rain drops */
  .raindrop {
    position: fixed; width: 2px; border-radius: 2px;
    pointer-events: none; z-index: 100;
    animation: rainFall linear forwards;
  }
  @keyframes rainFall {
    0%   { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(200px); }
  }

  /* Shake */
  @keyframes shake {
    0%,100%{transform:translateX(0) rotateY(0)}
    25%{transform:translateX(-4px) rotateY(-3deg)}
    75%{transform:translateX(4px) rotateY(3deg)}
  }
  .card.shaking { animation: shake 0.4s ease-in-out; }

  /* Mood indicator */
  #mood-label {
    font-size: 11px; letter-spacing: 3px; text-align: center;
    min-height: 18px; transition: color 0.4s; opacity: 0;
    transition: opacity 0.4s, color 0.4s;
  }
  #mood-label.visible { opacity: 1; }
  #mood-label.good    { color: var(--accent); }
  #mood-label.bad     { color: var(--pink); }
  #mood-label.neutral { color: var(--blue); }

  /* YouTube Player */
  #yt-section {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    animation: fadeIn 0.5s ease forwards;
  }
  #yt-section.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .yt-label {
    font-size: 10px; color: var(--dim); letter-spacing: 3px; text-align: center;
  }

  #yt-frame-wrapper {
    width: 100%; aspect-ratio: 16/9;
    border-radius: 12px; overflow: hidden;
    border: 1px solid #222;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  #yt-frame-wrapper iframe {
    width: 100%; height: 100%; border: none; display: block;
  }

  .yt-open-btn {
    font-size: 11px; color: var(--dim); letter-spacing: 2px;
    text-decoration: none; border-bottom: 1px solid #333;
    padding-bottom: 2px; transition: color 0.2s, border-color 0.2s;
  }
  .yt-open-btn:hover { color: var(--text); border-color: var(--text); }

  .share-btn {
    background: transparent; color: var(--dim);
    border: 1px solid #333; border-radius: 6px; font-family: 'Space Mono', monospace;
    font-size: 11px; padding: 10px 20px; cursor: pointer;
    letter-spacing: 2px; text-transform: uppercase;
    transition: all 0.2s;
  }
  .share-btn:hover { border-color: var(--text); color: var(--text); }
  .share-btn.copied { border-color: var(--accent); color: var(--accent); }

  .card.thinking { animation: pulse 0.55s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 380px) {
    .card-scene { width: 92vw; }
    .card-face { padding: 20px; }
  }
</style>
</head>

  { quote:"En mi vida fuiste turista,\ntú solo viste lo mejor de mí.", song:"Turista", album:"DeBÍ TiRAR MáS FOToS (2025)", mood:"bad", yt:"H7-7TXXnw8I", t:45 },
  { quote:"No, no te puedo olvidar,\nno te puedo borrar.", song:"Baile Inolvidable", album:"DeBÍ TiRAR MáS FOToS (2025)", mood:"bad", yt:"7pU6u5nqCN0", t:50 },

// ─── PREDICCIÓN "INTELIGENTE" ────────────────────────────────────────────────
// El conejo no lee mentes, pero sí lee tu pregunta: pondera el mood según
// palabras clave (sentimiento) sin dejar de ser un juego de azar real.
const MOOD_KEYWORDS = {
  bad: ["triste","tristeza","dolor","duele","doler","llorar","llore","lloro","extrano","extrana","perdi","perder","romper","ruptura","sola","solo","adios","despedida","rabia","enojo","enojada","enojado","mal","fatal","depre","miedo","preocupa","deuda","termine","termino","odia","sufrir","sufro","ex "],
  good: ["feliz","felicidad","amor","enamor","gusta","fiesta","celebrar","exito","logre","logro","bien","mejor","ganar","gane","ilusion","emocion","boda","cumpleanos","viaje","vacaciones","alegr"],
  neutral: ["duda","dudo","no se","incierto","futuro","destino","suerte","cuando","sera","pasara","pregunta","decision","elegir","deberia"],
};

function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function scoreMoods(question) {
  const q = normalize(question);
  const scores = { good: 0, bad: 0, neutral: 0 };
  for (const mood in MOOD_KEYWORDS) {
    for (const kw of MOOD_KEYWORDS[mood]) {
      if (q.includes(kw)) scores[mood]++;
    }
  }
  return scores;
}

function pickFortune(question) {
  const scores = scoreMoods(question);
  const totalScore = scores.good + scores.bad + scores.neutral;

  // Peso por mood: sin pistas en la pregunta, todo es 100% azar.
  // Con pistas, el mood detectado pesa más, pero los demás siguen siendo posibles.
  const weight = { good: 1, bad: 1, neutral: 1 };
  if (totalScore > 0) {
    for (const mood in weight) weight[mood] += scores[mood] * 3;
  }

  let pool = fortunes;
  // Evita repetir la misma canción dos veces seguidas si hay alternativas.
  if (lastSong) {
    const filtered = fortunes.filter(f => f.song !== lastSong);
    if (filtered.length) pool = filtered;
  }

  const totalWeight = pool.reduce((sum, f) => sum + weight[f.mood], 0);
  let roll = Math.random() * totalWeight;
  for (const f of pool) {
    roll -= weight[f.mood];
    if (roll <= 0) return f;
  }
  return pool[pool.length - 1];
}

const MOOD_META = {
  good:    { icon:"🎉", label:"✨ BUENA VIBRA ✨",    emojis:["🎉","⭐","🔥","💫","🏆","✨","🐰","💚"] },
  bad:     { icon:"💔", label:"🌧️ TIEMPOS DIFÍCILES", emojis:["💔","🌧️","😔","🥀","😢","🌑","🫥"]  },
  neutral: { icon:"🌊", label:"〰️ EL UNIVERSO HABLA", emojis:["🌊","🌙","🌀","💭","🔮","🐰","⚡"]  },
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let audioCtx = null;
let lastSong = null;
let isFlipped = false;
let isThinking = false;
const ASK_BTN_DEFAULT_LABEL = "Revelar mi destino";

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, dur, type='sine', vol=0.3, delay=0) {
  const ctx = getCtx();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = type;
  o.frequency.setValueAtTime(freq, ctx.currentTime + delay);
  g.gain.setValueAtTime(0, ctx.currentTime + delay);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + dur);
  o.start(ctx.currentTime + delay);
  o.stop(ctx.currentTime + delay + dur + 0.05);
}

function soundVictory() {
  // Fanfare ascendente
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => playTone(f, 0.25, 'square', 0.18, i * 0.12));
  setTimeout(() => {
    [784, 880, 1047].forEach((f, i) => playTone(f, 0.4, 'triangle', 0.2, i * 0.1));
  }, 600);
}

function soundDefeat() {
  // Descenso lúgubre
  const notes = [400, 330, 277, 220];
  notes.forEach((f, i) => playTone(f, 0.4, 'sawtooth', 0.12, i * 0.18));
  setTimeout(() => playTone(196, 0.8, 'sine', 0.15), 800);
}

function soundNeutral() {
  // Acorde misterioso
  [440, 554, 659].forEach((f, i) => playTone(f, 0.6, 'sine', 0.1, i * 0.08));
  setTimeout(() => [523, 622, 740].forEach((f, i) => playTone(f, 0.5, 'triangle', 0.1, i * 0.07)), 500);
}

// ─── CANVAS FX ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('fx-canvas');
const ctx2d = canvas.getContext('2d');
let fxActive = false;

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function launchConfetti() {
  resizeCanvas();
  const colors = ['#c8ff00','#ff2d78','#ffffff','#aa88ff','#00cfff','#ffdd00'];
  const particles = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width,
    y: -10,
    vx: (Math.random()-0.5)*4,
    vy: Math.random()*4+2,
    r: Math.random()*6+3,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360,
    spin: (Math.random()-0.5)*8,
    life: 1,
  }));
  fxActive = true;

  function draw() {
    ctx2d.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.rot += p.spin; p.life -= 0.008;
      ctx2d.save();
      ctx2d.globalAlpha = p.life;
      ctx2d.fillStyle = p.color;
      ctx2d.translate(p.x, p.y);
      ctx2d.rotate(p.rot * Math.PI/180);
      ctx2d.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.6);
      ctx2d.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else { ctx2d.clearRect(0,0,canvas.width,canvas.height); fxActive = false; }
  }
  draw();
}

function launchRain() {
  resizeCanvas();
  const drops = Array.from({length: 60}, () => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height*0.5,
    speed: Math.random()*4+3,
    length: Math.random()*20+10,
    life: 1,
  }));
  fxActive = true;

  function draw() {
    ctx2d.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    drops.forEach(p => {
      if (p.y > canvas.height + 30) return;
      alive = true;
      p.y += p.speed; p.life -= 0.005;
      ctx2d.save();
      ctx2d.globalAlpha = Math.max(0, p.life * 0.5);
      ctx2d.strokeStyle = '#ff2d78';
      ctx2d.lineWidth = 1.5;
      ctx2d.beginPath();
      ctx2d.moveTo(p.x, p.y);
      ctx2d.lineTo(p.x+1, p.y+p.length);
      ctx2d.stroke();
      ctx2d.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else { ctx2d.clearRect(0,0,canvas.width,canvas.height); fxActive = false; }
  }
  draw();
}

function launchSparks() {
  resizeCanvas();
  const colors = ['#00cfff','#aa88ff','#ffffff','#c8ff00'];
  const cx = canvas.width/2, cy = canvas.height/2;
  const particles = Array.from({length:40}, () => ({
    x: cx, y: cy,
    vx: (Math.random()-0.5)*10,
    vy: (Math.random()-0.5)*10,
    r: Math.random()*4+2,
    color: colors[Math.floor(Math.random()*colors.length)],
    life: 1,
  }));
  fxActive = true;

  function draw() {
    ctx2d.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.022;
      ctx2d.save();
      ctx2d.globalAlpha = p.life;
      ctx2d.fillStyle = p.color;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx2d.fill();
      ctx2d.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else { ctx2d.clearRect(0,0,canvas.width,canvas.height); fxActive = false; }
  }
  draw();
}

// ─── FLOATING EMOJIS ─────────────────────────────────────────────────────────
function launchEmojis(emojis) {
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'float-emoji';
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = (Math.random()*80+10) + 'vw';
      el.style.bottom = (Math.random()*20+5) + 'vh';
      el.style.animationDuration = (Math.random()*1.5+1.5) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }, i * 120);
  }
}

// ─── REVEAL ──────────────────────────────────────────────────────────────────
function reveal() {
  const q = document.getElementById('question').value.trim();
  if (!q) {
    const ta = document.getElementById('question');
    ta.style.borderColor = '#ff2d78';
    ta.focus();
    setTimeout(() => ta.style.borderColor = '#2a2a2a', 1000);
    return;
  }
  if (isFlipped) {
    const card = document.getElementById('card');
    card.classList.add('shaking');
    setTimeout(() => card.classList.remove('shaking'), 400);
    return;
  }
  if (isThinking) return;
  isThinking = true;

  // Pequeña pausa de "consulta" para dar sensación de que el conejo procesó la pregunta
  const askBtn = document.getElementById('ask-btn');
  const card = document.getElementById('card');
  askBtn.disabled = true;
  askBtn.textContent = 'Consultando al conejo…';
  card.classList.add('thinking');

  setTimeout(() => {
    card.classList.remove('thinking');
    revealFortune(q);
  }, 650);
}

function revealFortune(question) {
  const fortune = pickFortune(question);
  lastSong = fortune.song;
  const meta = MOOD_META[fortune.mood];

  document.getElementById('ask-btn').textContent = ASK_BTN_DEFAULT_LABEL;

  // Actualizar carta
  const back = document.getElementById('card-back');
  back.className = `card-face card-back ${fortune.mood}`;
  document.getElementById('mood-icon').textContent = meta.icon;
  document.getElementById('quote-text').textContent = `"${fortune.quote}"`;
  document.getElementById('song-text').innerHTML = `<span>${fortune.song}</span> · ${fortune.album}`;

  // Flip
  document.getElementById('card').classList.add('flipped');
  isFlipped = true;

  // UI
  document.getElementById('question').disabled = true;
  document.getElementById('reset-btn').classList.add('visible');

  // Body mood
  document.body.className = `mood-${fortune.mood}`;

  // Mood label
  const ml = document.getElementById('mood-label');
  ml.textContent = meta.label;
  ml.className = `visible ${fortune.mood}`;

  // Anuncio para lectores de pantalla
  document.getElementById('sr-announce').textContent =
    `${meta.label}. "${fortune.quote.replace(/\n/g, ' ')}" — ${fortune.song}, ${fortune.album}.`;

  // FX con delay post-flip
  setTimeout(() => {
    if (fortune.mood === 'good')     { soundVictory(); launchConfetti(); launchEmojis(meta.emojis); }
    else if (fortune.mood === 'bad') { soundDefeat();  launchRain();    launchEmojis(meta.emojis); }
    else                             { soundNeutral(); launchSparks();  launchEmojis(meta.emojis); }

    // YouTube embed
    const ytSection = document.getElementById('yt-section');
    const ytFrame   = document.getElementById('yt-frame');
    const ytLink    = document.getElementById('yt-link');
    const ytUrl     = `https://www.youtube.com/embed/${fortune.yt}?start=${fortune.t}&autoplay=1&rel=0`;
    const ytExtUrl  = `https://www.youtube.com/watch?v=${fortune.yt}&t=${fortune.t}s`;
    ytFrame.src = ytUrl;
    ytLink.href = ytExtUrl;
    ytSection.classList.add('visible');

    const shareBtn = document.getElementById('share-btn');
    shareBtn.classList.remove('copied');
    shareBtn.textContent = '⤴ Compartir';
    shareBtn.dataset.text =
      `"${fortune.quote.replace(/\n/g, ' ')}" — ${fortune.song} (Bad Bunny) 🐰\n${ytExtUrl}`;
  }, 900);

  isThinking = false;
}

// ─── COMPARTIR ───────────────────────────────────────────────────────────────
async function shareFortune() {
  const shareBtn = document.getElementById('share-btn');
  const text = shareBtn.dataset.text || '';
  if (!text) return;

  if (navigator.share) {
    try {
      await navigator.share({ text });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      // si falla el share nativo, caemos al portapapeles
    }
  }

  try {
    await navigator.clipboard.writeText(text);
    shareBtn.textContent = '✓ Copiado';
    shareBtn.classList.add('copied');
    setTimeout(() => {
      shareBtn.textContent = '⤴ Compartir';
      shareBtn.classList.remove('copied');
    }, 1800);
  } catch (err) {
    shareBtn.textContent = 'No se pudo copiar';
  }
}

// ─── RESET ───────────────────────────────────────────────────────────────────
function resetAll() {
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  isFlipped = false;
  isThinking = false;

  setTimeout(() => {
    document.getElementById('question').value = '';
    document.getElementById('question').disabled = false;
    document.getElementById('question').focus();
    const askBtn = document.getElementById('ask-btn');
    askBtn.disabled = false;
    askBtn.textContent = ASK_BTN_DEFAULT_LABEL;
    document.getElementById('reset-btn').classList.remove('visible');
    document.getElementById('mood-label').className = '';
    document.getElementById('sr-announce').textContent = '';
    document.body.className = '';

    // Limpiar YouTube
    const ytSection = document.getElementById('yt-section');
    document.getElementById('yt-frame').src = '';
    ytSection.classList.remove('visible');

    if (fxActive) {
      ctx2d.clearRect(0,0,canvas.width,canvas.height);
      fxActive = false;
    }
  }, 500);
}

// Enter en textarea
document.getElementById('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); reveal(); }
});
